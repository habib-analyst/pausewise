[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pausewise"
version = "0.1.0"
description = "Calibrated human-in-the-loop pausing for agents: pause when uncertainty actually predicts mistakes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Habib Ur Rehman" }]
keywords = ["human-in-the-loop", "ai-agents", "calibration", "uncertainty", "selective-prediction", "audit-trail"]
dependencies = []

[project.scripts]
pausewise = "pausewise.cli:main"

[tool.setuptools]
packages = ["pausewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
